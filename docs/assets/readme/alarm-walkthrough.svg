<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" aria-labelledby="title description" role="img" viewBox="0 0 1200 340"><title id="title">Illustrated alarm sequence</title><desc id="description">A possible fall starts SOS and queues an alert. Before escalation, three short PRG presses stop SOS and queue assistance text with location for the selected channel. Actual reception requires a working radio path.</desc><rect width="1200" height="340" fill="#071C31" rx="20"/><g font-family="Segoe UI, DejaVu Sans, sans-serif"><text x="32" y="39" fill="#41D8CF" font-size="16" font-weight="700">ILLUSTRATED ALARM SEQUENCE</text><text x="32" y="78" fill="#F3F7FA" font-size="25" font-weight="700">Assistance requested before automatic escalation</text><rect width="348" height="157" x="32" y="105" fill="#102C43" stroke="#41D8CF" stroke-width="3" rx="18"/><text x="52" y="148" fill="#41D8CF" font-size="20" font-weight="700">01</text><text x="52" y="187" fill="#F3F7FA" font-size="27" font-weight="700">Possible fall</text><text x="52" y="225" fill="#B4C8D6" font-size="20" font-weight="400">Motion sequence detected</text><text x="52" y="253" fill="#B4C8D6" font-size="20" font-weight="400">SOS + initial alert queued</text><path fill="none" stroke="#41D8CF" stroke-width="3" d="M392 183h21m-6 -5 7 5-7 5"/><rect width="348" height="157" x="426" y="105" fill="#102C43" stroke="#41D8CF" stroke-width="3" rx="18"/><text x="446" y="148" fill="#41D8CF" font-size="20" font-weight="700">02</text><text x="446" y="187" fill="#F3F7FA" font-size="27" font-weight="700">Wearer response</text><text x="446" y="225" fill="#B4C8D6" font-size="20" font-weight="400">Three short PRG presses</text><text x="446" y="253" fill="#B4C8D6" font-size="20" font-weight="400">SOS stops; assistance queued</text><path fill="none" stroke="#41D8CF" stroke-width="3" d="M786 183h21m-6 -5 7 5-7 5"/><rect width="348" height="157" x="820" y="105" fill="#102C43" stroke="#41D8CF" stroke-width="3" rx="18"/><text x="840" y="148" fill="#41D8CF" font-size="20" font-weight="700">03</text><text x="840" y="187" fill="#F3F7FA" font-size="27" font-weight="700">Channel message</text><text x="840" y="225" fill="#B4C8D6" font-size="20" font-weight="400">Assistance text + location</text><text x="840" y="253" fill="#B4C8D6" font-size="20" font-weight="400">Matching receiving radios</text><text x="32" y="311" fill="#B4C8D6" font-size="19">Concept sequence only. Radio reception depends on coverage, settings and available recipients.</text></g></svg>